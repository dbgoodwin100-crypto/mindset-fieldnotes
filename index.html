<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mindset Fieldnotes</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f3ee,#151916);--panel:light-dark(#fffdf8,#202622);--ink:light-dark(#202820,#f2f2e9);--muted:light-dark(#667064,#aab4a8);--line:light-dark(#e2e4d9,#39443b);--green:light-dark(#285d43,#9ad7ad);--green2:light-dark(#e7f1e7,#293c30);--gold:light-dark(#e9c66d,#5a4b27);--rose:light-dark(#f6e6dd,#49352e)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.top{padding:22px clamp(18px,5vw,64px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:var(--bg);display:grid;place-items:center;font-size:22px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:var(--panel);color:var(--ink);font-weight:650}.btn.primary{background:var(--green);color:light-dark(white,#102116);border-color:transparent}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1400px;margin:auto;min-height:calc(100vh - 87px)}aside{border-right:1px solid var(--line);padding:28px 18px}.navlabel{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);padding:0 12px;margin:10px 0}.navitem{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:12px;text-align:left;margin:3px 0}.navitem.active{background:var(--green2);font-weight:750}.navitem .num{margin-left:auto;font-size:11px;color:var(--muted)}.dot{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:13px}.sidebar-note{margin:30px 6px 0;padding:15px;border-radius:14px;background:var(--green2);font-size:12px;color:var(--muted)}main{padding:clamp(22px,4vw,52px);min-width:0}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);font-weight:850}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}.hero h1{font-size:clamp(29px,4vw,43px);letter-spacing:-1.8px;line-height:1.08;margin:8px 0 12px}.hero p{color:var(--muted);max-width:590px;margin:0}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:25px 0 32px}.stat{background:var(--panel);border:1px solid var(--line);padding:19px;border-radius:17px}.stat .big{font-size:30px;font-weight:800;letter-spacing:-1px}.stat .label{color:var(--muted);font-size:12px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 13px}.sectionhead h2{margin:0;font-size:20px;letter-spacing:-.5px}.sectionhead p{margin:4px 0 0;color:var(--muted);font-size:13px}.mindset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.mindcard{border:1px solid var(--line);background:var(--panel);padding:18px;border-radius:17px;text-align:left;color:var(--ink);transition:transform .15s,border-color .15s;min-width:0}.mindcard:hover{transform:translateY(-2px);border-color:var(--green)}.cardtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.symbol{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--green2);font-size:21px}.status{font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:800;color:var(--muted)}.mindcard h3{margin:15px 0 5px;font-size:18px}.mindcard p{margin:0;color:var(--muted);font-size:13px;min-height:40px}.meter{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:15px 0 8px}.meter span{height:100%;display:block;background:var(--green);border-radius:9px}.cardbottom{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:clamp(18px,3vw,28px);margin-bottom:17px}.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detail-title{display:flex;gap:15px;align-items:center}.detail-title .symbol{width:56px;height:56px;font-size:28px}.detail-title h1{margin:0;font-size:clamp(27px,4vw,38px);letter-spacing:-1.4px}.detail-title p{margin:3px 0 0;color:var(--muted);font-size:13px}.detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:17px}.field{margin:17px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--green)}textarea{resize:vertical;min-height:95px}.ratingline{display:flex;justify-content:space-between;align-items:center;gap:14px}.ratingline input{padding:0;accent-color:var(--green)}.ratingnum{font-size:24px;font-weight:800;min-width:50px;text-align:right}.visualbox{border-radius:15px;background:var(--green2);padding:19px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.visualbox .bigemoji{font-size:42px}.visualbox strong{font-size:14px}.visualbox span{font-size:12px;color:var(--muted)}.evidence{border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}.evidence strong{display:block;font-size:14px}.evidence .meta{font-size:11px;color:var(--muted);margin:3px 0 8px}.evidence p{font-size:13px;margin:0 0 8px;white-space:pre-wrap}.evidence a{color:var(--green)}.evidence-actions{display:flex;justify-content:flex-end}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:13px;margin-top:10px}.footer-note{font-size:12px;color:var(--muted);margin:25px 0 0}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;box-shadow:0 8px 28px #0002}.hidden{display:none!important}.smallbtn{font-size:12px;padding:6px 9px}.evidenceform{border-top:1px solid var(--line);margin-top:18px;padding-top:8px}.subtle{color:var(--muted)}
@media(max-width:780px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px;display:flex;gap:5px;overflow-x:auto}.navlabel,.sidebar-note{display:none}.navitem{width:auto;white-space:nowrap;margin:0;padding:8px}.navitem .num{display:none}main{padding:22px 16px}.detail-grid{grid-template-columns:1fr}.hero{display:block}.hero .pill{margin-top:14px}.stats{gap:8px}.stat{padding:13px}.stat .big{font-size:25px}.mindset-grid{grid-template-columns:1fr}.top{padding:16px}.top-actions .btn{padding:8px 10px}}
</style></head>
<body><div class="app" id="app"><header class="top"><div class="brand"><div class="logo">✳</div><div><strong>Mindset Fieldnotes</strong><small>A living record of how I grow</small></div></div><div class="top-actions"><button class="btn" id="exportBtn">↗ Export my data</button><button class="btn primary" id="addEvidenceTop">＋ Add evidence</button></div></header><div class="layout"><aside><div class="navlabel">YOUR WORKSPACE</div><button class="navitem active" data-page="home"><span class="dot">⌂</span> Overview</button><div class="navlabel" style="margin-top:25px">THE 8 MINDSETS</div><div id="sideMindsets"></div><div class="sidebar-note">✦ <strong style="color:var(--ink)">Small proof adds up.</strong><br>Capture real moments, reflect on them, and watch your growth become visible.</div></aside><main id="main"></main></div></div><div class="toast" id="toast"></div>
<script>
const defaults=[
{name:'Choice',icon:'🧭',color:'green',definition:'Choice is remembering that even when I cannot control everything that happens, I can choose how I respond and what I do next.',rating:5,example:'Starter example: When a group project got stressful, I chose to ask what still needed to get done instead of giving up. Replace this with a real moment from your own life.',goal:'For the next month, when I feel frustrated, I will pause, name two things I can control, and choose one useful next step. I will log at least two examples where I do this.',evidence:[]},
{name:'Mindset 2',icon:'🌱',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from school, friends, sports, home, or another part of life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 3',icon:'🔍',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 4',icon:'🧩',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 5',icon:'🤝',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 6',icon:'⚡',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 7',icon:'🛠️',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]},
{name:'Mindset 8',icon:'🌤️',definition:'Add the definition in your own words.',rating:0,example:'Add a real example from your life.',goal:'Write one specific action you can practice and how often you will do it.',evidence:[]}
];
let data;try{data=JSON.parse(localStorage.getItem('mindsetFieldnotes')||'null')}catch(e){};if(!Array.isArray(data)||data.length!==8)data=defaults;else data=data.map((d,i)=>({...defaults[i],...d,evidence:d.evidence||[]}));let current=0;let page='home';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('mindsetFieldnotes',JSON.stringify(data));}catch(e){} }
function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function progress(d){return Math.max(0,Math.min(100,Number(d.rating)||0))*10}
function setupNav(){let h='<button class="navitem" data-page="mindset" data-id="0"><span class="dot">🧭</span>'+esc(data[0].name)+'<span class="num">'+data[0].evidence.length+'</span></button>';for(let i=1;i<8;i++)h+='<button class="navitem" data-page="mindset" data-id="'+i+'"><span class="dot">'+esc(data[i].icon)+'</span>'+esc(data[i].name)+'<span class="num">'+data[i].evidence.length+'</span></button>';$('#sideMindsets').innerHTML=h;document.querySelectorAll('.navitem').forEach(b=>{b.classList.toggle('active',b.dataset.page===page&&(page==='home'||Number(b.dataset.id)===current));b.onclick=()=>{page=b.dataset.page;if(b.dataset.id!==undefined)current=Number(b.dataset.id);render()}})}
function renderHome(){let avg=Math.round(data.reduce((s,d)=>s+(Number(d.rating)||0),0)/8*10)/10;let ev=data.reduce((s,d)=>s+d.evidence.length,0);let ready=data.filter(d=>d.definition&&!d.definition.startsWith('Add the definition')&&d.rating>0).length;return `<div class="hero"><div><div class="eyebrow">PERSONAL GROWTH · FIELD GUIDE</div><h1>Growth isn't a grade.<br>It's a collection of moments.</h1><p>Track the eight mindsets through real-life proof: choices you make, challenges you work through, and lessons you carry forward. Keep this as your personal growth archive.</p></div><span class="pill">✦ Your year, in progress</span></div><div class="stats"><div class="stat"><div class="big">${ready}<span style="font-size:15px;color:var(--muted)"> / 8</span></div><div class="label">Mindsets started</div></div><div class="stat"><div class="big">${ev}</div><div class="label">Evidence moments saved</div></div><div class="stat"><div class="big">${avg}<span style="font-size:15px;color:var(--muted)"> / 10</span></div><div class="label">Average self-rating</div></div></div><div class="sectionhead"><div><h2>Your mindset map</h2><p>Open any card to reflect, rate yourself, and collect evidence.</p></div><span class="pill">8 sections</span></div><div class="mindset-grid">${data.map((d,i)=>`<button class="mindcard" data-open="${i}"><div class="cardtop"><div class="symbol">${esc(d.icon)}</div><span class="status">${d.evidence.length?d.evidence.length+' PROOF ITEM'+(d.evidence.length===1?'':'S'):i===0?'START HERE':'READY TO BUILD'}</span></div><h3>${esc(d.name)}</h3><p>${esc(d.definition)}</p><div class="meter"><span style="width:${progress(d)}%"></span></div><div class="cardbottom"><span>Current ability</span><strong>${Number(d.rating)||0}/10</strong></div></button>`).join('')}</div><div class="sectionhead"><div><h2>A simple rhythm that works</h2><p>Make this useful beyond the class.</p></div></div><div class="panel" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px"><div><div class="symbol">📸</div><strong>1. Capture</strong><p class="subtle" style="font-size:13px">Save a photo, project, quote, note, or moment as it happens.</p></div><div><div class="symbol">🪞</div><strong>2. Reflect</strong><p class="subtle" style="font-size:13px">Explain what it proves and what you learned.</p></div><div><div class="symbol">🎯</div><strong>3. Practice</strong><p class="subtle" style="font-size:13px">Set a concrete next step, then revisit your rating later.</p></div></div><p class="footer-note">Tip: Rename Mindsets 2–8 to match your class's official list. Your Choice section is a starter draft—edit it so it sounds like you.</p>`}
function renderDetail(){let d=data[current];return `<div class="hero"><div><div class="eyebrow">MINDSET ${String(current+1).padStart(2,'0')} / 08</div><div class="detail-title" style="margin-top:10px"><div class="symbol">${esc(d.icon)}</div><div><h1>${esc(d.name)}</h1><p>Build your definition. Find the proof. Choose the next step.</p></div></div></div><button class="btn" id="backBtn">← Overview</button></div><div class="detail-grid"><div><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>My understanding</h2><p>Explain the big idea in your own words.</p></div></div><div class="field"><label for="mindName">MINDSET NAME</label><input id="mindName" value="${esc(d.name)}" /></div><div class="field"><label for="definition">MY DEFINITION</label><textarea id="definition" placeholder="To me, this mindset means…">${esc(d.definition)}</textarea></div><div class="field"><label for="example">A MOMENT FROM MY LIFE</label><textarea id="example" placeholder="What happened? What did you do? What does it show?">${esc(d.example)}</textarea><small>Be specific: describe the situation and what your actions show about this mindset.</small></div><div class="field"><label for="goal">MY NEXT-STEP PLAN</label><textarea id="goal" placeholder="I will practice this by…">${esc(d.goal)}</textarea><small>Try to include an action, a frequency or deadline, and how you'll know it worked.</small></div><button class="btn primary" id="saveMindset">Save reflection</button></section><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>Evidence locker</h2><p>Save artifacts and proof as the year unfolds.</p></div><span class="pill">${d.evidence.length} saved</span></div><div id="evidenceList">${renderEvidence(d)}</div><div class="evidenceform"><h3 style="margin:8px 0 0">＋ Add a new evidence item</h3><div class="field"><label for="evTitle">TITLE</label><input id="evTitle" placeholder="e.g. Team project reflection" /></div><div class="field"><label for="evDate">DATE</label><input id="evDate" type="date" /></div><div class="field"><label for="evType">TYPE</label><select id="evType"><option>Reflection</option><option>Photo / screenshot</option><option>Schoolwork / project</option><option>Feedback / quote</option><option>Personal experience</option><option>Other artifact</option></select></div><div class="field"><label for="evNote">WHAT DOES THIS PROVE?</label><textarea id="evNote" placeholder="What happened, what did you do, and how does it connect to this mindset?" style="min-height:80px"></textarea></div><div class="field"><label for="evLink">LINK TO ARTIFACT (OPTIONAL)</label><input id="evLink" type="url" placeholder="Paste a link to a Drive file, photo, doc, or project" /><small>Store the actual file in your own Drive or device, then paste a share link here.</small></div><button class="btn primary" id="addEvidence">Save evidence</button></div></section></div><div><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>My current ability</h2><p>Rate where you are today, not where you hope to be.</p></div></div><div class="ratingline"><div><strong>Self-rating</strong><div class="subtle" style="font-size:12px">1 = just starting · 10 = confident</div></div><div class="ratingnum"><span id="ratingVal">${Number(d.rating)||0}</span><span style="font-size:12px;color:var(--muted)">/10</span></div></div><div class="field"><input id="rating" type="range" min="0" max="10" step="1" value="${Number(d.rating)||0}" style="padding:0"/><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>0 · Not rated</span><span>5 · Developing</span><span>10 · Strong</span></div></div><button class="btn" id="saveRating">Save rating</button></section><section class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>Visual anchor</h2><p>A symbol to remember the idea.</p></div></div><div class="visualbox"><div class="bigemoji">${esc(d.icon)}</div><div><strong>${esc(d.name)} in action</strong><br><span>Choose a symbol that reminds you of this mindset. You can change it below.</span></div></div><div class="field"><label for="icon">CHOOSE AN ICON</label><select id="icon">${['🧭','🌱','🔍','🧩','🤝','⚡','🛠️','🌤️','💡','🚀','🪴','🎯','🪞','🌊','🧠','🧗','🧵','🗝️'].map(x=>`<option ${x===d.icon?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" id="saveIcon">Save visual</button></section><section class="panel" style="background:var(--green2)"><div style="font-size:24px">✦</div><strong>Reflection prompt</strong><p class="subtle" style="font-size:13px">What would someone watching your week notice you doing differently if this mindset were getting stronger?</p></section></div></div>`}
function renderEvidence(d){if(!d.evidence.length)return '<div class="empty">No evidence yet. Your next small moment belongs here.</div>';return d.evidence.slice().reverse().map((e,rev)=>{let idx=d.evidence.length-1-rev;return `<div class="evidence"><strong>${esc(e.title||'Untitled evidence')}</strong><div class="meta">${esc(e.date||'No date')} · ${esc(e.type||'Reflection')}</div><p>${esc(e.note||'')}</p>${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">Open linked artifact ↗</a>`:''}<div class="evidence-actions"><button class="btn smallbtn" data-delete="${idx}">Remove</button></div></div>`}).join('')}
function render(){setupNav();$('#main').innerHTML=page==='home'?renderHome():renderDetail();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.open);page='mindset';render()});if(page==='mindset')wireDetail()}
function wireDetail(){const d=data[current];$('#backBtn').onclick=()=>{page='home';render()};$('#rating').oninput=e=>$('#ratingVal').textContent=e.target.value;$('#saveMindset').onclick=()=>{d.name=$('#mindName').value.trim()||'Untitled mindset';d.definition=$('#definition').value;d.example=$('#example').value;d.goal=$('#goal').value;save();render();toast('Reflection saved')};$('#saveRating').onclick=()=>{d.rating=Number($('#rating').value);save();render();toast('Rating updated')};$('#saveIcon').onclick=()=>{d.icon=$('#icon').value;save();render();toast('Visual updated')};$('#addEvidence').onclick=()=>{let title=$('#evTitle').value.trim();let note=$('#evNote').value.trim();if(!title&&!note){toast('Add a title or reflection first');return}let link=$('#evLink').value.trim();if(link&&!/^https?:\/\//i.test(link)){toast('Link should start with https://');return}d.evidence.push({title:title||'Reflection',date:$('#evDate').value,type:$('#evType').value,note,link});save();render();toast('Evidence added to '+d.name)};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{d.evidence.splice(Number(b.dataset.delete),1);save();render();toast('Evidence removed')})}
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({title:'Mindset Fieldnotes',exportedAt:new Date().toISOString(),mindsets:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mindset-fieldnotes-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')};$('#addEvidenceTop').onclick=()=>{page='mindset';current=0;render();setTimeout(()=>document.querySelector('.evidenceform')?.scrollIntoView({behavior:'smooth',block:'start'}),50)};render();
</script></body></html>
